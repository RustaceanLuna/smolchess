[package]
name = "smolchess"
description = "A chess library for Rust, supporting Classical, FRC and DFRC"
version = "0.1.1"
edition = "2024"
categories = ["no-std", "no-std::no-alloc", "games"]
keywords = ["chess", "game"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustaceanLuna/smolchess"

[dependencies]
thiserror = "2.0.20"

[features]
default = ["std"]
std = []
alloc = []
hyperbola = []
nightly = []
pext = ["nightly"]
